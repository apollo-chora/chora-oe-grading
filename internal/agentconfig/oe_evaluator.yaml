# oe_evaluator — per-sub-agent tier + prompt config (ADR-172 §D2/§D4/§D5).
#
# AGENT-DRIVEN tiering (mirrors qgen agentconfig shape, CR qgen 2026-06-01):
# the evaluator is the grader of record — it scores ONE OE answer against a
# weighted rubric + model_answer AND, in assess_summary mode, drafts the
# holistic whole-assessment narrative. Both are quality-critical (a learner's
# grade rides on them) so it runs the HIGH text tier.
#
# The model id is env-only: the boot layer reads the REQUIRED OE_EVALUATOR_MODEL
# env var and the optional OE_EVALUATOR_FALLBACK_MODELS comma-separated chain
# (empty = no fallback) and forwards both to the gateway (logical_model_id +
# InvokeRequest.fallback_logical_model_ids); the gateway HONOURS the chain.
# The tier label — not the model id — carries the ADR-172 §D2 split.
# prompt_version selects the composer template version (embedded v1 here).
agent: oe_evaluator
sub_agents:
  evaluator:
    tier: high
    prompt_version: v1
