# oe_moderator — per-sub-agent tier + prompt config (ADR-172 §D2).
#
# AGENT-DRIVEN tiering (mirrors qgen_critic, CR qgen 2026-06-01): the moderator
# is a single tool-free JUDGE over the evaluator's score+rationale+rubric —
# accept | reject+feedback for rubric fidelity, hallucination, internal
# consistency. It does NOT re-grade. Like qgen_critic it is the CHEAP text tier
# (a fast accept/reject + feedback judge over one structured input).
#
# The model id is env-only: the boot layer reads the REQUIRED OE_MODERATOR_MODEL
# env var and the optional OE_MODERATOR_FALLBACK_MODELS comma-separated chain
# (empty = no fallback) and forwards both to the gateway (logical_model_id +
# InvokeRequest.fallback_logical_model_ids); the gateway HONOURS the chain.
# The tier label — not the model id — is what carries the ADR-172 §D2 split.
# prompt_version selects the composer template version (embedded v1 here).
agent: oe_moderator
sub_agents:
  moderator:
    tier: cheap
    prompt_version: v1
