# oe_moderator — per-sub-agent model + prompt config (ADR-172 §D2).
#
# AGENT-DRIVEN routing (mirrors qgen_critic, CR qgen 2026-06-01): the moderator
# is a single tool-free JUDGE over the evaluator's score+rationale+rubric —
# accept | reject+feedback for rubric fidelity, hallucination, internal
# consistency. It does NOT re-grade. It sends primary_model as the gateway
# logical_model_id + fallback_models as the agent-declared fallback chain; the
# gateway HONOURS it.
#
#   longcat-2.5-preview = moderator → longcat-2.5-preview
#
# Single-provider deployment: the HIGH/CHEAP tier labels no longer select a
# model — every text route resolves to LongCat-2.5-Preview in the
# chora-model-gateway registry.
agent: oe_moderator
sub_agents:
  moderator:
    tier: cheap
    primary_model: longcat-2.5-preview
    fallback_models: [longcat-2.5-preview]
    prompt_version: v1
